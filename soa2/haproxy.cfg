global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Входная точка (балансировщик принимает запросы на порту 8085)
frontend heroes_frontend
    bind *:8085
    default_backend heroes_backend

# Группа бэкендов: балансировка roundrobin между двумя инстансами
backend heroes_backend
    balance roundrobin
    server heroes1 127.0.0.1:9081 check
    server heroes2 127.0.0.1:9082 check
