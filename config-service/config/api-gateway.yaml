server:
  address: 127.0.0.1
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:file:../human-being-service/certs/localhost.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-alias: localhost
eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
zuul:
  ignored-services: '*'
  routes:
    human-beings:
      path: /human-beings/**
      service-id: human-being-service
      strip-prefix: false
human-being-service:
  ribbon:
    IsSecure: true
    NFLoadBalancerRuleClassName: com.netflix.loadbalancer.RoundRobinRule
