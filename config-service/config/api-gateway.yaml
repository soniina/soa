server:
  address: 0.0.0.0
  port: 28082
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:file:./certs/gateway.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-alias: gateway
    trust-store: ${SSL_TRUST_STORE:file:./certs/truststore.p12}
    trust-store-type: PKCS12
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD:changeit}
eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
zuul:
  ignored-services: '*'
  routes:
    human-beings:
      path: /human-beings/**
      service-id: human-being-service
      strip-prefix: false
human-being-service:
  ribbon:
    IsSecure: true
    ConnectTimeout: 3000
    ReadTimeout: 5000
    NFLoadBalancerRuleClassName: com.netflix.loadbalancer.RoundRobinRule
