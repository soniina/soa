global
    nbthread 1
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Входная точка: слушаем порт 29085
frontend heroes_frontend
    bind *:29085 ssl crt /home/studs/s408391/soa/haproxy.pem
    
    # Включаем встроенную панель мониторинга
    stats enable
    stats uri /stats
    stats refresh 5s

    default_backend heroes_backend

# Два экземпляра сервиса
backend heroes_backend
    balance roundrobin
    server heroes1 127.0.0.1:29081 check
    server heroes2 127.0.0.1:29082 check
